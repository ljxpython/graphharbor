[project]
name = "graphharbor"
# Lockstep with graphharbor-runtime; independent of langgraph-api releases.
version = "0.13.0.post10"
description = "GraphHarbor CLI for a self-hosted LangGraph Agent Server on PostgreSQL and Redis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Mohankumar Ramachandran", email = "mail@mohanram.dev" }]
keywords = [
    "langgraph",
    "langsmith",
    "langchain",
    "langgraph-api",
    "langgraph-sdk",
    "agent-server",
    "agent-protocol",
    "ai-agents",
    "agents",
    "llm",
    "self-hosted",
    "open-source",
    "cli",
    "postgres",
    "redis",
    "uvicorn",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.7",
    "python-dotenv>=0.8.0",
    "pyfiglet>=1.0.0",
    "langgraph-cli>=0.4.0,<0.5",
    "mcp>=1.23,<2",
    "uvicorn[standard]>=0.51.0",
    # Exact same version as graphharbor-runtime (lockstep releases).
    "graphharbor-runtime==0.13.0.post10",
]

[project.urls]
Homepage = "https://github.com/ljxpython/graphharbor"
Repository = "https://github.com/ljxpython/graphharbor"
Issues = "https://github.com/ljxpython/graphharbor/issues"
Changelog = "https://github.com/ljxpython/graphharbor/releases"

[project.scripts]
graphharbor = "langhost.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langhost"]

[tool.uv.sources]
graphharbor-runtime = { workspace = true }
