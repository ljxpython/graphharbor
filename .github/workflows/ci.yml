name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DATABASE_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/langgraph
  REDIS_URI: redis://localhost:6379/0
  LANGGRAPH_RUNTIME_EDITION: pg
  LG_RUNTIME_PG_TEST: "1"
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.11"

      - name: Lockfile up to date
        run: uv lock --check

      - name: Version lockstep
        run: python3 scripts/check_versions.py

      - name: Sync
        run: uv sync --group dev  # NOSONAR — editable workspace packages require build; lockfile pins deps

      - name: Ruff format
        run: uv run ruff format --check libs  # NOSONAR — runs already-synced tools; no package install

      - name: Ruff check
        run: uv run ruff check libs  # NOSONAR — runs already-synced tools; no package install

      - name: mypy
        run: uv run mypy  # NOSONAR — runs already-synced tools; no package install

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.11"

      - name: Build packages
        # Local packages must be built; disable UV_NO_BUILD for this step only.
        env:
          UV_NO_BUILD: "0"
        run: |
          uv build --package graphharbor-runtime
          uv build --package graphharbor
          ls -la dist

      - name: Smoke import wheels
        run: |
          RUNTIME_WHL="$(ls dist/graphharbor_runtime-*.whl | head -n1)"
          GRAPH_HARBOR_WHL="$(ls dist/graphharbor-*.whl | head -n1)"
          # NOSONAR - wheel path is a pinned local artifact, not index resolution
          uv run --isolated --no-project --with "${RUNTIME_WHL}" \
            python -c "import langgraph_runtime_pg; print(langgraph_runtime_pg.__name__)"
          # NOSONAR - wheel paths are pinned local artifacts, not index resolution
          uv run --isolated --no-project --with "${RUNTIME_WHL}" --with "${GRAPH_HARBOR_WHL}" \
            python -c "import langhost; print(langhost.__name__)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  production-contract:
    name: Production contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:16.9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: langgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d langgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: ${{ matrix.python-version }}

      - name: Sync
        run: uv sync --group dev

      - name: Apply GraphHarbor migration
        run: uv run graphharbor migrate upgrade

      - name: Production, security and persistence regression
        run: |
          uv run pytest \
            libs/langgraph-runtime-pg/tests/test_production_contract.py \
            libs/langgraph-runtime-pg/tests/test_persistence_contract.py \
            libs/langgraph-runtime-pg/tests/test_public_runtime.py \
            libs/langgraph-runtime-pg/tests/test_rest_contract.py \
            libs/langgraph-runtime-pg/tests/test_official_sdk_contract.py \
            libs/langhost/tests/test_cli.py \
            -o "timeout=60"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      N_JOBS_PER_WORKER: "2"
      FF_OPTIMIZED_STREAMING: "true"
      LANGGRAPH_ALLOW_BLOCKING: "true"
      LANGGRAPH_AUTH_TYPE: noop
      LG_BG_JOB_HEARTBEAT: "5"
      LANGGRAPH_INTEGRATION_URL: http://127.0.0.1:2024
      PYTHONUNBUFFERED: "1"
      PYTEST_ADDOPTS: "-vv --tb=short --timeout=60 --timeout-method=signal"
    services:
      postgres:
        image: postgres:16.9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: langgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d langgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.11"

      - name: Sync
        run: uv sync --group dev  # NOSONAR — editable workspace packages require build; lockfile pins deps

      - name: Resolve upstream SDK ref
        id: upstream
        run: |
          SDK_VERSION="$(.venv/bin/python -c 'import importlib.metadata as m; print(m.version("langgraph-sdk"))')"
          echo "ref=sdk==${SDK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "langgraph-sdk=${SDK_VERSION} → sdk==${SDK_VERSION}"

      - name: Checkout langchain-ai/langgraph (SDK tests + graphs)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: langchain-ai/langgraph
          ref: ${{ steps.upstream.outputs.ref }}
          path: .tests/langgraph_api
          sparse-checkout: |
            libs/sdk-py
          sparse-checkout-cone-mode: true

      - name: Install upstream SDK + suite deps
        run: |
          uv build --wheel --out-dir /tmp/sdk-wheel .tests/langgraph_api/libs/sdk-py
          uv pip install --no-build /tmp/sdk-wheel/*.whl
          uv pip install --no-build \
            "deepagents==0.6.12" \
            "langchain==1.3.14" \
            "langchain-core==1.5.0" \
            "langchain-anthropic==1.4.8"

      - name: First-party unit/queue tests
        run: |
          # Truncates PG — must run before the API server holds DB connections.
          uv run pytest \
            libs/langgraph-runtime-pg/tests/test_interface.py \
            libs/langgraph-runtime-pg/tests/test_queue.py \
            libs/langgraph-runtime-pg/tests/test_rest_contract.py \
            libs/langgraph-runtime-pg/tests/test_official_sdk_contract.py \
            libs/langhost/tests/test_cli.py \
            -o "timeout=30"  # NOSONAR — pytest from locked env

      - name: Start langgraph-api (edition=pg)
        run: |
          ROOT="$PWD"
          INTEGRATION_DIR="$ROOT/.tests/langgraph_api/libs/sdk-py/integration"
          export LANGSERVE_GRAPHS="$(
            uv run python -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))["graphs"]))' \
              "${INTEGRATION_DIR}/langgraph.json"
          )"
          echo "graphs: ${LANGSERVE_GRAPHS}"
          echo "LANGSERVE_GRAPHS<<EOF" >> "$GITHUB_ENV"
          echo "${LANGSERVE_GRAPHS}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          (
            cd "${INTEGRATION_DIR}"
            exec uv run --project "${ROOT}" uvicorn langgraph_api.server:app \
              --host 127.0.0.1 --port 2024 --log-level info
          ) > /tmp/langgraph-api.log 2>&1 &
          echo $! > /tmp/langgraph-api.pid
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:2024/ok" >/dev/null; then
              echo "server ready (${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "server failed; log:" >&2
          tail -n 200 /tmp/langgraph-api.log >&2 || true
          exit 1

      - name: First-party live-server E2E
        timeout-minutes: 8
        run: uv run pytest libs/langgraph-runtime-pg/tests/test_e2e.py -o "timeout=60" --reruns 2 --reruns-delay 1

      - name: Upstream SDK integration tests
        timeout-minutes: 8
        run: |
          uv run pytest .tests/langgraph_api/libs/sdk-py/tests/integration \
            -o "addopts=" -m integration --reruns 2 --reruns-delay 1

      - name: Stop langgraph-api
        if: always()
        run: |
          if [[ -f /tmp/langgraph-api.pid ]]; then
            kill "$(cat /tmp/langgraph-api.pid)" 2>/dev/null || true
          fi
          if [[ -f /tmp/langgraph-api.log ]]; then
            echo "::group::langgraph-api log (tail)"
            tail -n 400 /tmp/langgraph-api.log || true
            echo "::endgroup::"
          fi

  javascript-contract:
    name: JavaScript SDK contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URI: postgresql+asyncpg://postgres:postgres@localhost:5432/langgraph
      REDIS_URI: redis://localhost:6379/0
      LANGGRAPH_RUNTIME_EDITION: pg
      LG_RUNTIME_PG_TEST: "1"
      UV_FROZEN: "1"
      GRAPHHARBOR_URL: http://127.0.0.1:31397
    services:
      postgres:
        image: postgres:16.9
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: langgraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d langgraph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/javascript/package.json

      - name: Sync Python workspace
        run: uv sync --group dev

      - name: Apply GraphHarbor migration
        run: uv run graphharbor migrate upgrade

      - name: Install official JavaScript SDK
        working-directory: tests/javascript
        run: npm install --ignore-scripts --no-package-lock

      - name: Start GraphHarbor Agent Server
        run: |
          uv run graphharbor serve \
            --host 127.0.0.1 \
            --port 31397 \
            --config tests/javascript/fixtures/langgraph.json \
            --database-uri "${DATABASE_URI}" \
            --redis-uri "${REDIS_URI}" \
            --no-browser > /tmp/graphharbor-js-contract.log 2>&1 &
          echo $! > /tmp/graphharbor-js-contract.pid
          for i in $(seq 1 60); do
            if curl -sf "${GRAPHHARBOR_URL}/ready" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          tail -n 200 /tmp/graphharbor-js-contract.log
          exit 1

      - name: Start GraphHarbor worker
        run: |
          uv run graphharbor worker \
            --config tests/javascript/fixtures/langgraph.json \
            --database-uri "${DATABASE_URI}" \
            --redis-uri "${REDIS_URI}" \
            --n-jobs-per-worker 1 > /tmp/graphharbor-js-contract-worker.log 2>&1 &
          echo $! > /tmp/graphharbor-js-contract-worker.pid

      - name: Run JavaScript SDK contract
        run: node scripts/test_js_sdk.mjs

      - name: Stop GraphHarbor Agent Server
        if: always()
        run: |
          if [[ -f /tmp/graphharbor-js-contract.pid ]]; then
            kill "$(cat /tmp/graphharbor-js-contract.pid)" 2>/dev/null || true
          fi
          if [[ -f /tmp/graphharbor-js-contract-worker.pid ]]; then
            kill "$(cat /tmp/graphharbor-js-contract-worker.pid)" 2>/dev/null || true
          fi
          if [[ -f /tmp/graphharbor-js-contract.log ]]; then
            tail -n 200 /tmp/graphharbor-js-contract.log || true
          fi
          if [[ -f /tmp/graphharbor-js-contract-worker.log ]]; then
            tail -n 200 /tmp/graphharbor-js-contract-worker.log || true
          fi
