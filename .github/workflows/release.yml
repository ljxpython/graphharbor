name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      repository:
        description: "Package index to publish to"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Full lint / build / e2e must pass before any upload.
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.11"

      - name: Lockfile + version lockstep
        run: |
          uv lock --check
          python3 scripts/check_versions.py

      - name: Tag matches package versions
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          RUNTIME="$(uv version --package graphharbor-runtime --short)"
          GRAPH_HARBOR="$(uv version --package graphharbor --short)"
          echo "tag=${TAG} runtime=${RUNTIME} graphharbor=${GRAPH_HARBOR}"
          if [[ "${TAG}" != "${RUNTIME}" || "${TAG}" != "${GRAPH_HARBOR}" ]]; then
            echo "Tag v${TAG} must match both package versions (got runtime=${RUNTIME}, graphharbor=${GRAPH_HARBOR})" >&2
            exit 1
          fi

      - name: Build
        run: |
          rm -rf dist
          uv build --package graphharbor-runtime
          uv build --package graphharbor
          ls -la dist

      - name: Smoke import wheels
        run: |
          RUNTIME_WHL="$(ls dist/graphharbor_runtime-*.whl | head -n1)"
          GRAPH_HARBOR_WHL="$(ls dist/graphharbor-*.whl | head -n1)"
          # Exact built wheel paths — no unlocked package names from an index.
          # NOSONAR - wheel path is a pinned local artifact, not index resolution
          uv run --isolated --no-project --with "${RUNTIME_WHL}" \
            python -c "import langgraph_runtime_pg; print(langgraph_runtime_pg.__name__)"
          # NOSONAR - wheel paths are pinned local artifacts, not index resolution
          uv run --isolated --no-project --with "${RUNTIME_WHL}" --with "${GRAPH_HARBOR_WHL}" \
            python -c "import langhost; print(langhost.__name__)"
      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-graphharbor:
    name: Publish graphharbor
    needs: publish-graphharbor-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi' && 'testpypi-graphharbor' || 'pypi-graphharbor' }}
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # No checkout here — disable cache so post-setup does not fail the job.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.11"

      - name: Publish graphharbor to PyPI
        env:
          PUBLISH_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.repository || 'pypi' }}
        run: |
          if [[ "${PUBLISH_REPOSITORY}" == "testpypi" ]]; then
            uv publish --trusted-publishing always \
              --publish-url https://test.pypi.org/legacy/ \
              --check-url https://test.pypi.org/simple/ dist/graphharbor-*
          else
            uv publish --trusted-publishing always \
              --check-url https://pypi.org/simple/ dist/graphharbor-*
          fi

  publish-graphharbor-runtime:
    name: Publish graphharbor-runtime
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi' && 'testpypi-graphharbor-runtime' || 'graphharbor-runtime' }}
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # No checkout here — disable cache so post-setup does not fail the job.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.11"

      - name: Publish graphharbor-runtime to PyPI
        env:
          PUBLISH_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.repository || 'pypi' }}
        run: |
          if [[ "${PUBLISH_REPOSITORY}" == "testpypi" ]]; then
            uv publish --trusted-publishing always \
              --publish-url https://test.pypi.org/legacy/ \
              --check-url https://test.pypi.org/simple/ dist/graphharbor_runtime-*
          else
            uv publish --trusted-publishing always \
              --check-url https://pypi.org/simple/ dist/graphharbor_runtime-*
          fi

  verify-testpypi:
    name: Verify TestPyPI installation
    needs: [publish-graphharbor, publish-graphharbor-runtime]
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.11"

      - name: Install exactly the published TestPyPI pair
        run: |
          RUNTIME_WHL="$(ls dist/graphharbor_runtime-*.whl | head -n1)"
          VERSION="$(basename "${RUNTIME_WHL}" | sed -E 's/^graphharbor_runtime-(.+)-py3-none-any\.whl$/\1/')"
          # TestPyPI's simple index can take more than five minutes to expose
          # a newly uploaded release to a GitHub-hosted runner.
          for attempt in $(seq 1 36); do
            if uv run --isolated --no-project \
              --index-strategy unsafe-best-match \
              --default-index https://test.pypi.org/simple \
              --index https://pypi.org/simple \
              --with "graphharbor==${VERSION}" \
              python -c "import importlib.metadata as m; assert m.version('graphharbor') == '${VERSION}'; assert m.version('graphharbor-runtime') == '${VERSION}'"; then
              break
            fi
            if [[ "${attempt}" == "36" ]]; then
              exit 1
            fi
            sleep 15
          done
          uv run --isolated --no-project \
            --index-strategy unsafe-best-match \
            --default-index https://test.pypi.org/simple \
            --index https://pypi.org/simple \
            --with "graphharbor==${VERSION}" \
            graphharbor --version

  github-release:
    name: GitHub Release
    needs: [publish-graphharbor, publish-graphharbor-runtime]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "v${VER}" \
            --generate-notes \
            --repo "${{ github.repository }}" \
            dist/*
